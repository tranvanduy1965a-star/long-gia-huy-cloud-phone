name: Node.js checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: cloud-api
        run: npm install
      - name: Validate API JavaScript syntax
        run: |
          node --check cloud-api/server.js
          node --check cloud-api/provider.js
          node --check cloud-api/test/provider.test.js
          node --check cloud-api/test/server.test.js
          node --check cloud-api/test/frontend-syntax.test.js
      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('cloud-api/package.json', 'utf8'))"
      - name: Run provider safety tests
        working-directory: cloud-api
        run: npm test
      - name: Build production Docker image
        run: docker build -f cloud-api/Dockerfile -t long-gia-huy-cloud-phone:ci .
      - name: Smoke-test production Docker container
        run: |
          docker run -d --name lgh-cloudphone-ci -e SESSION_SECRET=test-only-session-secret-with-at-least-32-characters -p 3000:3000 long-gia-huy-cloud-phone:ci
          trap 'docker logs lgh-cloudphone-ci || true; docker rm -f lgh-cloudphone-ci || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/lgh-health.json; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Container health endpoint did not become ready' >&2
            exit 1
          fi
          node -e "const h=require('/tmp/lgh-health.json'); if(h.ok!==true) process.exit(1)"
          curl --fail --silent http://127.0.0.1:3000/ | grep -qi 'LONG GIA HUY'
          curl --fail --silent http://127.0.0.1:3000/api/plans >/tmp/lgh-plans.json
          node -e "const p=require('/tmp/lgh-plans.json').plans.map(x=>x.days); if([1,2,3,7,30].some(x=>!p.includes(x))) process.exit(1)"
