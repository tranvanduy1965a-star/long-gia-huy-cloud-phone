# Render Blueprint for the LONG GIA HUY account portal + API.
# The Starter web service and persistent disk are billable; deploying this
# Blueprint requires the repository owner's explicit action in Render.
services:
  - type: web
    name: long-gia-huy-cloud-phone
    runtime: node
    plan: starter
    region: singapore
    rootDir: cloud-api
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: cloudphone-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DB_PATH
        value: /var/data/cloudphone.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER_IDS
        value: ""
      - key: ALIBABA_CLOUD_REGION
        value: ap-southeast-1
      - key: ALIBABA_CLOUD_ACCESS_KEY_ID
        sync: false
      - key: ALIBABA_CLOUD_ACCESS_KEY_SECRET
        sync: false
